# ground-station/docker-compose.yml — the fleet operator surface.
#
# This compose is the OPERATOR layer. The Mender GW itself is brought up
# separately by `mender/server/up.sh up` (it clones + composes upstream Mender OSS
# at a pinned tag — too large + fast-moving to vendor here). This file adds the
# fleet-ops surface ON TOP of that GW and joins its network, preserving the
# users/devices/packages/deployments separation Mender already models.
#
#   mender/server/up.sh up          # 1. the Mender GW (deviceauth/inventory/deployments/S3)
#   docker compose up -d            # 2. the operator layer (this file)
#
# v1 = the fleet-ops CLI (fleet/fleet.py) against the GW; the operator UX (web
# dashboard: campaign planning, device-group targeting, rollout + health/inventory
# monitoring) is the service that grows here. Until it lands, this compose only
# wires the shared network + an ops shell with fleet.py on PATH.
services:
  # The registry for OUR two distribution planes — runtime+services (theia/dist)
  # and user apps (user-ws/dist). SEPARATE from the Mender GW's internal seaweedfs
  # (which is .mender-only, no external port): this is the externally-reachable S3
  # that `theia release --runtime/--app` writes + colony's factory provision reads.
  #   bucket theia-runtime/<ver>/{theia-runtime,theia-services}_<arch>.deb + index.json
  #   bucket theia-apps/<fleet>/<app>/<ver>/{<fc>_<arch>.deb, manifest.json, index.json}
  # The GS's own S3 (runtime / swp / roles / distributions / rollouts planes): SeaweedFS, the same server and
  # version Mender v4.1.5 ships for itself, pinned by digest. A SEPARATE instance with its own credentials (not
  # Mender's): the two planes share nothing but the image. theia-runtime is anonymously READABLE (rigs pull the
  # runtime over plain HTTP at provision); everything else needs the key. Replaces minio/minio (image withdrawn).
  gs-s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: gs-s3
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=64", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    # Reached over TLS only: the Mender project's gateway (traefik, :443) routes /theia-* here (labels below), so
    # rigs and `theia release --s3` use https://<gateway name>/theia-runtime/... with the pinned gateway
    # certificate. No plain-HTTP port on the network (GS_S3_LOCAL_BIND: loopback only, for maintenance).
    ports:
      - "${GS_S3_LOCAL_BIND:-127.0.0.1}:9000:9000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.gs-s3.rule: "PathPrefix(`/theia-`)"
      traefik.http.routers.gs-s3.entrypoints: "websecure"
      traefik.http.routers.gs-s3.tls: "true"
      traefik.http.routers.gs-s3.priority: "99998"
      traefik.http.services.gs-s3.loadbalancer.server.port: "9000"
    configs:
      - source: gs-s3-conf
        target: /etc/seaweedfs/s3.json
    volumes:
      - gs-s3-data:/data
    networks:
      - mender

  gs-api:
    build: ./api
    container_name: gs-api
    volumes:
      - ./fleet:/gs/fleet:ro      # clients.py loads fleet.py (the Mender client)
      - "${MENDER_CA_PATH:?}:/run/mender-server-ca.crt:ro"                # pins the Mender gateway certificate
      - "${TS_API_TOKEN_PATH:-/dev/null}:/run/secrets/ts_api_token:ro"   # unset = VPN join disabled
    extra_hosts:
      - "docker.mender.io:${MENDER_GATEWAY_IP:?set MENDER_GATEWAY_IP (the address the gateway answers on, e.g. the GS tailnet IP)}"
    environment:
      # The Mender GW (server DNS name on the mender network) + a PAT.
      MENDER_SERVER: "${MENDER_SERVER:-https://docker.mender.io}"   # the gateway by its certificate name (network alias below)
      MENDER_CA: /run/mender-server-ca.crt
      MENDER_TOKEN: "${MENDER_TOKEN:?set MENDER_TOKEN (a Mender PAT) in .env}"
      MENDER_INSECURE: "${MENDER_INSECURE:-0}"
      MENDER_FLAVOR: "${MENDER_FLAVOR:-oss}"
      # The distribution planes (the gs-s3 service above).
      S3_ENDPOINT: "${S3_ENDPOINT:-http://gs-s3:9000}"
      MINIO_USER: "${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}"      # gs-api reads the S3 key under its old names
      MINIO_PASSWORD: "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env (no default)}"
      # API key gating the mutating routes (deploy/publish). Unset → open (the
      # browser-only path); set it the moment a remote caller (CI, MCP) reaches in.
      GS_API_KEY: "${GS_API_KEY:?set GS_API_KEY in .env (openssl rand -hex 24)}"
      # colony-api (the BASE deployment authority) — gs-api fans /api/deployments
      # out to BOTH Mender (app) and this; the base-state mirror writes Mender tags.
      COLONY_API: "${COLONY_API:-http://colony-api:8081}"
      # the fleet VPN backend (api/gs_api/vpn.py): the Tailscale API token as a 0600 FILE, mounted read-only
      TS_API_TOKEN_FILE: /run/secrets/ts_api_token
      TS_TAILNET: "${TS_TAILNET:--}"
      COLONY_API_KEY: "${COLONY_API_KEY:?set COLONY_API_KEY in .env (openssl rand -hex 24)}"
      # The com aggregator answering ListMachines (cluster Observability presence +
      # the base-state mirror's rig→device map). The central board's com.
      GS_COM_AGGREGATOR: "${GS_COM_AGGREGATOR:?set GS_COM_AGGREGATOR=<fleet host>:7700 in .env}"
    networks:
      - mender

  # colony-api — the BASE deployment authority, dockerized + Mender-API-shaped.
  # gs-api fans out to this + Mender so the operator drives both base (colony) and
  # app (Mender) from one surface. Runs the SAME Ansible plays the colony CLI runs;
  # needs the colony repo (playbooks + bin/colony), the workspace bundle (registry
  # + dist/manifest), and an SSH key to reach the rigs — all mounted, read-only
  # where possible. See ground-station/docs/design/gs-ux-design.md §6.
  #   COLONY_DIR    path to the colony repo checkout (default ../colony)
  #   THEIA_WS_DIR  path to the workspace bundle (registry + dist) (default ../theia)
  #   SSH_KEY       path to the private key authorized on the rigs (default ~/.ssh/id_rsa)
  colony-api:
    build: "${COLONY_DIR:-../colony}/api"
    container_name: colony-api
    volumes:
      - "${COLONY_DIR:-../colony}:/colony:ro"          # playbooks + bin/colony
      - "${THEIA_WS_DIR:-../theia}:/workspace:ro"        # registry + dist/manifest
      - "${SSH_KEY:?set SSH_KEY to the DEDICATED fleet ssh key (never a personal key)}:/root/.ssh/id_rsa:ro"
      - colony-journal:/var/lib/colony                   # deployment history
      - "${MENDER_CA_PATH:?set MENDER_CA_PATH=<mender-server>/compose/certs/mender.crt}:/run/mender-server-ca.crt:ro"
    environment:
      THEIA_WORKSPACE: /workspace
      COLONY_ANSIBLE: /colony/ansible
      COLONY_JOURNAL: /var/lib/colony/journal.jsonl
      # the S3 plane as BOTH the controller (this container) and the rigs reach it: the fleet host's address
      THEIA_S3_ENDPOINT: "${THEIA_S3_ENDPOINT:?set THEIA_S3_ENDPOINT=http://<fleet host>:9000 in .env}"
      # the Mender server as the RIGS reach it (colony tasks/mender-enroll.yml); empty host = no Mender enrollment
      MENDER_SERVER_HOST: "${MENDER_RIG_HOST:-docker.mender.io}"
      MENDER_SERVER_IP: "${MENDER_RIG_IP:-}"
      MENDER_SERVER_CA: /run/mender-server-ca.crt
      # API key gating the mutating routes (same pattern as gs-api).
      COLONY_API_KEY: "${COLONY_API_KEY:?set COLONY_API_KEY in .env (openssl rand -hex 24)}"
    networks:
      - mender

  # The operator web UI — the Mender-like fleet view + vendoring + monitoring.
  # Static SPA served by nginx, which proxies /api → gs-api.
  gs-web:
    build: ./web
    container_name: gs-web
    ports:
      - "${GS_BIND:-127.0.0.1}:${GS_WEB_PORT:-8088}:80"   # GS_BIND: the fleet-tailnet address of the GS, never 0.0.0.0
    environment:
      # injected into the /api proxy as X-GS-Key so the trusted operator browser
      # can call the mutating routes without ever carrying the key client-side.
      GS_API_KEY: "${GS_API_KEY:?set GS_API_KEY in .env (openssl rand -hex 24)}"
    depends_on:
      - gs-api
    networks:
      - mender

volumes:
  gs-s3-data:
  colony-journal:

# The Mender GW (up.sh) creates this network; join it as external so fleet-ops
# reaches the deployments/inventory APIs without re-declaring the GW services.
networks:
  mender:
    external: true
    name: "${MENDER_NETWORK:-fleet-mender_default}"

configs:
  gs-s3-conf:
    content: |
      {"identities": [
        {"name": "anonymous", "actions": ["Read:${S3_RUNTIME_BUCKET:-theia-runtime}", "List:${S3_RUNTIME_BUCKET:-theia-runtime}"]},
        {"name": "gs", "credentials": [{"accessKey": "${S3_ACCESS_KEY:?}", "secretKey": "${S3_SECRET_KEY:?}"}],
         "actions": ["Admin", "Read", "Write", "List", "Tagging"]}
      ]}
